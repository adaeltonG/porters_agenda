# Installed on the server as /etc/nginx/snippets/porters.conf and pulled into the
# zetahub server block (/etc/nginx/sites-available/zetahub) with:
#     include /etc/nginx/snippets/porters.conf;
# HTTPS is handled by Cloudflare in front of the server.

location = /porters {
    return 301 /porters/;
}

location ^~ /porters/ {
    proxy_pass http://127.0.0.1:3010/;     # trailing slash strips the /porters prefix
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 40m;              # several phone screenshots
    proxy_read_timeout 300s;               # reading a screenshot can take up to a minute
    proxy_send_timeout 300s;
}
